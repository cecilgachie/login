<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apology</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      transition: opacity 1s ease;
    }
    .container {
      text-align: center;
    }
    h1 {
      color: #fff;
      font-size: 2.5em;
      margin-bottom: 20px;
    }
    button {
      padding: 15px 30px;
      border: none;
      border-radius: 30px;
      background: #ff6b6b;
      color: white;
      font-size: 1.2em;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #ff4757;
      transform: scale(1.05);
    }
    .fade-out {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Princess, I have something to say...</h1>
    <button onclick="redirect()">Accept My Apology Princess</button>
  </div>

  <script>
    function redirect() {
      document.body.classList.add("fade-out");
      setTimeout(() => {
        window.location.href = "apology.html";
      }, 1000); // matches the CSS transition duration
    }
  </script>
</body>
</html>
